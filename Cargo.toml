[package]
name = "cosmic-ext-tweaks"
version = "0.2.5"
edition = "2024"

[dependencies]
dirs = "6"
open = "5"
log = "0.4"
ron = "0.12"
anyhow = "1"
url = "2.5.8"
nucleo = "0.5"
thiserror = "2"
serde_json = "1"
rust-embed = "8"
tracing = "0.1.44"
icu_collator = "2"
i18n-embed-fl = "0.10"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }
icu_provider = { version = "2", features = ["sync"] }
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["macros", "fs", "rt"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
cosmic-panel-config = { git = "https://github.com/pop-os/cosmic-panel" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
cosmic-settings-config = { git = "https://github.com/pop-os/cosmic-settings-daemon" }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser"] }
cosmic-ext-config-templates = { git = "https://github.com/ryanabx/cosmic-ext-config-templates" }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    # About widget for the app
    "about",
    # Support creating additional application windows.
    "multi-window",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
    # GPU-accelerated rendering
    "wgpu",
    # Accessibility support
    "a11y",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Add Wayland support to winit
    "wayland",
]

